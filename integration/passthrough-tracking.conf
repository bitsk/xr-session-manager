# Opt-in for a kernel exposing the additional XR2 CAMSS resources.
# Apply only at an agreed session restart; installation does not activate it.
[Service]
Environment=A081_PASSTHROUGH=1
# Explicit indoor diagnostic gain; saved sensor controls are restored at exit.
Environment=A081_PASSTHROUGH_GAIN_PROFILE=diagnostic-indoor
Environment=A081_CAMERA_PREVIEW_SOCKET=/run/mix-camera-preview/frames.sock
