# Example for a graphics service WITHOUT PAMName, not the current PAM/logind
# XR service. Its children can move to a login scope; that needs separate
# identity-checked scope binding before graphics resource control is valid.
[Service]
CPUWeight=1000
AllowedCPUs=4-7
ExecStartPost=+/usr/bin/python3 /opt/mix-vr-shell-controller/scheduling-cgroup.py --unit %n --minimum 20
